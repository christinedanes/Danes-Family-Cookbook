name: Update recipe table of contents

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild table of contents
        run: python3 .github/scripts/update_toc.py

      - name: Save changes
        run: |
          if git diff --quiet; then
            echo "Already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update table of contents"
            git push
          fi
